name: CI

on:
  push:
    branches: [main, master, develop, development, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop, development, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Release version (tags only)
        id: relver
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Maven verify
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            mvn -B verify -Drevision="${GITHUB_REF_NAME#v}"
          else
            mvn -B verify
          fi

      - name: Upload JARs for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          if-no-files-found: error
          path: |
            target/bytecode-processor-${{ steps.relver.outputs.ver }}.jar
            target/bytecode-processor-${{ steps.relver.outputs.ver }}-all.jar

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: release-jars

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-jars/*.jar
