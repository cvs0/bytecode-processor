name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - development
      - "release/**"
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - develop
      - development
      - "release/**"
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Maven verify
        run: mvn -B verify

      - name: Publish SNAPSHOT to GitHub Packages (develop / development only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/development')
        run: mvn -B deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
