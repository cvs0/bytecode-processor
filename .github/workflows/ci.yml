name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - development
      - "release/**"
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - develop
      - development
      - "release/**"
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ github.token }}

      - name: Verify
        run: mvn -B verify

      - name: Deploy SNAPSHOT (develop only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/development')
        run: mvn -B deploy -DskipTests