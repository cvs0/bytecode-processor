name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - develop
      - "release/**"
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify
        run: mvn -B verify
